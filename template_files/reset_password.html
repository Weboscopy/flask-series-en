<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Find your Tour - Recover your password</title>
  <link rel="icon" type="image/x-icon" href="./images/guide.ico">
  <link rel="stylesheet" href="./styles.css">
  <script defer src="./main.js"></script>
</head>

<body>
  <main>
    <section id="section_reset_password">
      <h1>Create a new password</h1>
      <form action="/auth/reset-password" method="POST">
        <h3>Enter your new password</h3>
        <fieldset class="group">
          <img src="./images/lock.svg" class="icon" alt="icon-lock">
          <input type="password" name="password" placeholder="Your new password" autocomplete="off">
        </fieldset>
        <h3>Can you confirm your new password?</h3>
        <fieldset class="group">
          <img src="./images/key.svg" class="icon" alt="icon-key">
          <input type="password" name="confirm_password" placeholder="Confirm your new password" autocomplete="off">
        </fieldset>
        <button type="submit">
          <img src="./images/shield.svg" class="icon" alt="icon-log-in">
          <span>Change my password</span>
        </button>
      </form>
    </section>
  </main>
  <footer>
    <nav>
      <a href="/home/homepage">
        <img src="./images/home.svg" alt="icon-home">
      </a>
      <a href="/guide/profile">
        <img src="./images/guide.svg" alt="icon-guide">
      </a>
    </nav>
  </footer>
</body>

</html>
